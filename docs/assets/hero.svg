<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="Oasis, un espacio pastel para las rutas de apoyo en Villavicencio">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d9a7c">
        <animate attributeName="stop-color" values="#6d9a7c;#6f9eb5;#9a84ae;#c48974;#6d9a7c" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.45" stop-color="#6f9eb5">
        <animate attributeName="stop-color" values="#6f9eb5;#9a84ae;#c48974;#6d9a7c;#6f9eb5" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#c48974">
        <animate attributeName="stop-color" values="#c48974;#6d9a7c;#6f9eb5;#9a84ae;#c48974" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6ee"/>
      <stop offset="1" stop-color="#f4ece1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5c463a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="340" rx="28" fill="url(#wash)"/>
  <g opacity="0.9">
    <ellipse cx="120" cy="40" rx="90" ry="48" fill="#c9e4f5">
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 8; 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="860" cy="70" rx="110" ry="56" fill="#e4d4f4">
      <animateTransform attributeName="transform" type="translate" values="0 0; -16 10; 0 0" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="780" cy="300" rx="120" ry="50" fill="#c9dcc8">
      <animateTransform attributeName="transform" type="translate" values="0 0; -12 -8; 0 0" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="180" cy="310" rx="100" ry="42" fill="#f6cdb6">
      <animateTransform attributeName="transform" type="translate" values="0 0; 14 -6; 0 0" dur="13s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g transform="translate(64 92)">
    <text x="0" y="0" fill="#6d6778" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">UN ESPACIO TUYO</text>
    <text x="0" y="78" fill="url(#brand)" font-family="Palatino Linotype, Palatino, Georgia, serif" font-size="78">Oasis</text>
    <text x="0" y="124" fill="#3d3a46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20">Rutas de apoyo en Villavicencio, con fuente y fecha.</text>
    <g transform="translate(0 156)">
      <rect width="168" height="36" rx="18" fill="#ffffff" filter="url(#soft)"/>
      <circle cx="22" cy="18" r="6" fill="#f6cdb6"/>
      <text x="38" y="23" fill="#3d3a46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Villavicencio</text>
    </g>
  </g>
  <g transform="translate(690 78)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="7s" repeatCount="indefinite"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#8fb59a" stroke-opacity="0.7" stroke-width="1.4">
        <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="28s" repeatCount="indefinite"/>
      </circle>
      <g filter="url(#soft)">
        <ellipse cx="100" cy="118" rx="46" ry="18" fill="#c9dcc8"/>
        <ellipse cx="78" cy="96" rx="22" ry="34" fill="#f6cdb6" transform="rotate(-28 78 96)"/>
        <ellipse cx="122" cy="96" rx="22" ry="34" fill="#e4d4f4" transform="rotate(28 122 96)"/>
        <ellipse cx="100" cy="78" rx="18" ry="32" fill="#c9e4f5"/>
        <ellipse cx="100" cy="104" rx="16" ry="22" fill="#f8e7b0"/>
        <circle cx="100" cy="108" r="7" fill="#fbf6ee" stroke="#3d3a46" stroke-width="1.4"/>
      </g>
    </g>
  </g>
  <rect x="-180" y="0" width="120" height="340" fill="#ffffff" opacity="0.28">
    <animate attributeName="x" values="-180;960" dur="7.5s" repeatCount="indefinite"/>
  </rect>
</svg>
